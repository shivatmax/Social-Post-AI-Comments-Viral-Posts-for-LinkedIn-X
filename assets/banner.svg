<svg width="1200" height="340" viewBox="0 0 1200 340" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a66c2"/>
      <stop offset="0.55" stop-color="#0a3d78"/>
      <stop offset="1" stop-color="#0b0f17"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="96" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1d9bf0"/>
      <stop offset="1" stop-color="#0a66c2"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="340" rx="24" fill="url(#bg)"/>

  <!-- subtle sparkles -->
  <g fill="#ffffff" opacity="0.10">
    <circle cx="980" cy="70" r="3"/>
    <circle cx="1060" cy="130" r="2"/>
    <circle cx="1110" cy="60" r="4"/>
    <circle cx="900" cy="250" r="3"/>
    <circle cx="1040" cy="270" r="2.5"/>
  </g>

  <!-- logo tile -->
  <g transform="translate(72, 122)">
    <rect width="96" height="96" rx="22" fill="url(#tile)"/>
    <path d="M48 22 L54 42 L74 48 L54 54 L48 74 L42 54 L22 48 L42 42 Z" fill="#ffffff"/>
  </g>

  <!-- wordmark -->
  <text x="200" y="150" fill="#ffffff" font-size="62" font-weight="700" letter-spacing="-1">Social Post</text>
  <text x="202" y="196" fill="#cfe3fb" font-size="26" font-weight="500">AI content discovery, virality analysis &amp; one-click comments</text>
  <text x="202" y="230" fill="#9cc4ef" font-size="26" font-weight="500">for LinkedIn and X (Twitter).</text>

  <!-- pills -->
  <g font-size="20" font-weight="600">
    <g transform="translate(202, 258)">
      <rect width="168" height="40" rx="20" fill="#ffffff" opacity="0.12"/>
      <text x="84" y="26" fill="#ffffff" text-anchor="middle">100% local</text>
    </g>
    <g transform="translate(384, 258)">
      <rect width="220" height="40" rx="20" fill="#ffffff" opacity="0.12"/>
      <text x="110" y="26" fill="#ffffff" text-anchor="middle">Bring your own key</text>
    </g>
    <g transform="translate(618, 258)">
      <rect width="240" height="40" rx="20" fill="#ffffff" opacity="0.12"/>
      <text x="120" y="26" fill="#ffffff" text-anchor="middle">Gemini · OpenAI · Claude</text>
    </g>
  </g>
</svg>
